# Dev/test tooling only. The addon itself ships with no install step:
# Kodi loads it from the addon directory with vendored dependencies.
[project]
name = "service-webostv-dev"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
extend-exclude = ["resources/lib/vendor"]
